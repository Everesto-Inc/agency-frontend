# Managed by Backstage (imported into DevOps Space orchid). The space is decided by the platform registry, not by this file.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: agency-frontend
  title: Autonomous Agency — web app
  description: "Web app of the agency: sign-in, streamed chat with history, usage board, account, admin (activation board, overview)"
  annotations:
    github.com/project-slug: Everesto-Inc/agency-frontend
    backstage.io/techdocs-ref: dir:.
    everesto.live/ci-workflow: ci.yml
    everesto.live/image: ghcr.io/everesto-inc/agency-frontend
    everesto.live/loop: v1.1.2
    everesto.live/gitleaks: "on"
    everesto.live/trivy: "report"
    everesto.live/semgrep: "on"
    everesto.live/dependabot: "on"
  tags: [react, typescript, vite, tailwind, nginx]
spec:
  type: website
  lifecycle: experimental
  owner: orchid
  system: orchid
  consumesApis:
    - agency-api                                # the backend's public API (agency-backend)
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: agency-frontend-gitops
  description: CD of agency-frontend — ArgoCD dev-agency-frontend (manual sync), prod via Promote
  annotations:
    github.com/project-slug: Everesto-Inc/agency-frontend-gitops
    argocd/app-name: dev-agency-frontend
    everesto.live/namespace: agency-frontend
    everesto.live/url-dev: https://agency-frontend-dev.everesto.live
    backstage.io/techdocs-ref: url:https://github.com/Everesto-Inc/agency-frontend-gitops/tree/main
spec:
  type: gitops
  owner: orchid
  system: orchid
  dependsOn: [component:default/agency-frontend]
